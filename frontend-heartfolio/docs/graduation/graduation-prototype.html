<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--hand:'Gochi Hand',cursive}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

/* airline gate */
.s-airline{background:linear-gradient(180deg,#0f2742 0%,#173a5e 55%,#e9845f 100%)}
.gate-top{color:#fff;margin-bottom:18px}.gate-top b{display:block;font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:clamp(1.4rem,6vw,1.8rem)}.gate-top span{font-family:'IBM Plex Mono',monospace;font-size:.82rem;opacity:.75}
.pass{position:relative;width:min(88vw,360px);filter:drop-shadow(0 24px 40px rgba(0,0,0,.35));cursor:pointer;text-align:start;font-family:'Red Hat Display',sans-serif;color:#0f2742}
.pass-main,.pass-stub{background:#fffaf1;padding:18px 20px}
.pass-main{position:relative;border-radius:18px 18px 0 0}
.pass-main::before,.pass-main::after{content:"";position:absolute;bottom:-12px;width:24px;height:24px;border-radius:50%;background:#1b4064;z-index:2}
.pass-main::before{left:-12px}.pass-main::after{right:-12px}
.pass-stub{border-radius:0 0 18px 18px;border-top:2px dashed rgba(15,39,66,.3);transform-origin:15% 0}
.airline{display:flex;justify-content:space-between;font-weight:800;font-size:.95rem;color:#ff6b4a}
.airline svg{width:22px;height:22px;fill:#ff6b4a}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin:14px 0 6px}
.route .code{font-weight:900;font-size:clamp(2.6rem,13vw,3.4rem);line-height:.9}
.route .city{display:block;font-size:.8rem;color:#4b5d74;font-weight:600}
.route .to{text-align:end}
.route .arrow svg{width:34px;height:34px;fill:#ff6b4a;transform:rotate(90deg)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:12px}
.g3 small{display:block;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.06em;color:#4b5d74;text-transform:uppercase}
.g3 b{display:block;font-weight:800;font-size:.95rem;line-height:1.2}
.g3 .w{grid-column:span 3}
.barcode{height:44px;background:repeating-linear-gradient(90deg,#0f2742 0 2px,transparent 2px 4px,#0f2742 4px 5px,transparent 5px 8px,#0f2742 8px 11px,transparent 11px 12px)}
.tear{margin-top:10px;text-align:center;font-weight:800;color:#ff6b4a;animation:breathe 2.2s ease-in-out infinite}
/* space start */
.s-space{background:radial-gradient(80% 50% at 50% 100%,#1a2556,transparent),#070b1f;color:#e8f3ff;font-family:'Exo 2',sans-serif}

.s-space .st-btn{background:#ff8a3d;color:#070b1f;font-family:'Exo 2',sans-serif;letter-spacing:.06em;text-transform:uppercase}
/* arcade start */
.s-arcade{background:linear-gradient(rgba(255,255,255,.04) 50%,transparent 50%) 0 0/100% 4px,radial-gradient(60% 40% at 50% 40%,#3a1f7a,#1b1036);color:#f4ecff}
.s-arcade .logo{font-family:'Press Start 2P',monospace;font-size:clamp(1.3rem,6.6vw,2.2rem);line-height:1.4;color:#ffe14d;text-shadow:4px 4px 0 #ff4fd8,8px 8px 0 #3d1a7a}
.s-arcade .who{font-family:'VT323',monospace;font-size:1.6rem;color:#3df5ff;margin:14px 0 28px}

/* ── Controls ───────────────────────────────────────────────────── */
.ctl{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:10px;z-index:60;display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .6s}
body[data-screen="page"] .ctl{opacity:1;pointer-events:auto}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);color:#1f2a44;border:1.5px solid rgba(0,0,0,.1)}
html[data-j="space"] .ib,html[data-j="arcade"] .ib,html[data-j="museum"] .ib{background:rgba(0,0,0,.45);color:#fff;border-color:rgba(255,255,255,.25)}
html[data-j="arcade"] .ib{border-radius:0;box-shadow:0 0 0 2px #ff4fd8}
.ib .ic{width:20px;height:20px}

/* ── Hero ───────────────────────────────────────────────────────── */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 18px 60px;overflow:hidden}
.hero .rv{opacity:0;transform:translateY(16px);animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
.hero h1{font-family:var(--display);font-weight:var(--dw);font-size:clamp(2rem,9vw,3.2rem);line-height:1.08;margin-top:22px}
.hero .deg{font-weight:700;margin-top:8px}
.hero .meta{font-family:var(--mono);font-size:.9rem;color:var(--soft);margin-top:4px}
.hframe{position:relative;width:min(62vw,240px)}
.hframe img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
/* airline: cabin window */
html[data-j="airline"] .hero{background:linear-gradient(180deg,#f3ece0,#e8dfd0)}
html[data-j="airline"] .hframe{aspect-ratio:3/4;border-radius:44%/34%;padding:14px;background:linear-gradient(145deg,#fdfaf4,#d8cfbf);box-shadow:0 20px 40px rgba(60,40,20,.2)}
html[data-j="airline"] .hframe .glass{position:relative;width:100%;height:100%;border-radius:44%/34%;overflow:hidden;background:linear-gradient(180deg,#8fd0f5,#d9f0fb);box-shadow:inset 0 0 0 6px #cfc5b4}
html[data-j="airline"] .hframe img{position:absolute;left:10%;top:16%;width:80%;height:72%;border-radius:12px}
html[data-j="airline"] .shade{position:absolute;inset:0;background:linear-gradient(180deg,#e9e1d2,#d9cfbe);will-change:transform}
html[data-j="airline"] .tagpill{margin-top:20px;display:inline-flex;gap:8px;padding:.45rem 1rem;border-radius:999px;background:#2b2b2b;color:#ffd27a;font-family:var(--mono);font-size:.8rem}
/* space: helmet visor */
html[data-j="space"] .hframe{border-radius:50%;padding:12px;background:linear-gradient(145deg,#f2f5fa,#9aa7bb);box-shadow:0 0 0 6px #2a3560,0 0 60px rgba(124,243,255,.25)}
html[data-j="space"] .hframe img{border-radius:50%;filter:saturate(1.1)}
html[data-j="space"] .hframe::after{content:"";position:absolute;inset:12px;border-radius:50%;background:linear-gradient(135deg,rgba(124,243,255,.35),transparent 45%,transparent 60%,rgba(255,138,61,.25))}
html[data-j="space"] .hero h1{text-transform:uppercase;letter-spacing:.04em}
html[data-j="space"] .tagpill{margin-top:18px;font-family:var(--mono);color:#7cf3ff;border:1px solid var(--line);padding:.4rem 1rem;border-radius:4px}
/* arcade: character select */
html[data-j="arcade"] .hframe{padding:8px;background:#2a1a52;box-shadow:0 0 0 4px #ff4fd8,0 0 0 8px #1b1036,0 0 0 12px #3df5ff}
html[data-j="arcade"] .hframe img{image-rendering:pixelated}
html[data-j="arcade"] .hero h1{font-size:clamp(1.1rem,5vw,1.6rem);line-height:1.6;color:#ffe14d}
html[data-j="arcade"] .stats{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:start;font-size:1.4rem}
html[data-j="arcade"] .bar{display:inline-block;height:12px;background:repeating-linear-gradient(90deg,#3df5ff 0 10px,transparent 10px 12px);vertical-align:middle}
/* museum: gilded portrait */
html[data-j="museum"] .hframe{padding:16px;background:linear-gradient(135deg,#8a6a2a,#f2d98f 30%,#b08a3a 50%,#f2d98f 70%,#8a6a2a);box-shadow:0 30px 60px rgba(0,0,0,.5),inset 0 0 0 4px rgba(0,0,0,.2)}
html[data-j="museum"] .hframe img{aspect-ratio:4/5;box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
html[data-j="museum"] .hero::before{content:"";position:absolute;top:0;left:50%;width:70%;height:70%;transform:translateX(-50%);background:radial-gradient(ellipse 50% 70% at 50% 0%,rgba(255,240,200,.18),transparent 70%);pointer-events:none}
html[data-j="museum"] .label{margin-top:22px;background:#fbf8f1;color:#2a2a2a;padding:12px 18px;text-align:start;max-width:320px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
html[data-j="museum"] .label b{display:block;font-family:'Bodoni Moda',serif;font-size:1.3rem}
html[data-j="museum"] .label span{display:block;font-size:.85rem;color:#555}
html[data-j="museum"] .hero h1{display:none}
/* summit: photo pinned on a map */
html[data-j="summit"] .hero{background:linear-gradient(180deg,#f7d9b8 0%,#dfe7ef 60%)}
html[data-j="summit"] .hframe{padding:8px;background:#fff;box-shadow:0 14px 28px rgba(31,47,69,.25);transform:rotate(-2deg)}
html[data-j="summit"] .alt{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:55;padding:.45rem .8rem;border-radius:10px;background:rgba(31,47,69,.85);color:#fff;font-family:'Alegreya Sans',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .5s}
html[data-j="summit"] body[data-screen="page"] .alt{opacity:1}

/* ── Chapters (shared skeleton) ─────────────────────────────────── */
.ch{position:relative;padding:clamp(64px,11vw,100px) 16px}
.wrap{max-width:820px;margin:0 auto}
.h2{font-family:var(--display);font-weight:var(--dw);font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.15;text-align:center;margin-bottom:1.3rem;text-wrap:balance}
html[data-j="arcade"] .h2{font-size:clamp(1rem,4.6vw,1.4rem);line-height:1.6;color:#3df5ff}
html[data-j="space"] .h2{text-transform:uppercase;letter-spacing:.06em;font-size:clamp(1.3rem,5.6vw,1.9rem)}
html[data-j="museum"] .h2{font-style:italic;font-weight:500}
html[data-j="museum"] .h2::after{content:"";display:block;width:60px;height:1px;margin:.5em auto 0;background:var(--accent)}
.hint{text-align:center;color:var(--soft);margin:-8px 0 1.5rem;font-size:.95rem}
.count-line{text-align:center;margin-top:16px;font-family:var(--mono);color:var(--soft)}
.card{background:var(--card);color:var(--ink);border:1px solid var(--line)}
html[data-j="airline"] .card,html[data-j="summit"] .card{border:0;box-shadow:0 12px 30px rgba(15,39,66,.12);border-radius:16px}
html[data-j="arcade"] .card{border:0;box-shadow:0 0 0 3px #5b3fa0,0 0 0 6px #1b1036;border-radius:0}
html[data-j="museum"] .card{color:#2a2a2a;border:0}

/* PATH: one structure, five skins */
.path{position:relative;max-width:640px;margin:0 auto;padding-left:58px}
.path-line{position:absolute;left:22px;top:10px;bottom:10px;border-left:3px dashed var(--line)}
.mover{position:absolute;left:6px;top:0;width:34px;height:34px;display:grid;place-items:center;font-size:1.6rem;z-index:2;will-change:transform}
.mover svg{width:100%;height:100%;fill:var(--accent);transform:rotate(180deg)}
.stop{position:relative;margin-bottom:22px}
.stop::before{content:"";position:absolute;left:-43px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.stop .tag{font-family:var(--mono);font-size:.85rem;color:var(--soft);margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.stop .tag b{font-family:var(--display);font-weight:var(--dw);color:var(--ink);font-size:1.2rem}
.big{overflow:hidden}
.big img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.big .tx{padding:14px 16px 16px}
.lbl{display:inline-block;font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .5rem;border-radius:4px;background:var(--ink);color:var(--bg);margin-bottom:6px}
.stop.now .big{outline:3px solid var(--accent)}
.stop.now .lbl{background:var(--accent);color:#fff}
.mini{display:flex;align-items:center;gap:12px;width:100%;border:0;padding:8px;text-align:start}
.mini img{width:74px;height:74px;object-fit:cover;flex:none;border-radius:10px}
.mini b{display:block;line-height:1.3}
.mini small{font-family:var(--mono);color:var(--soft)}
html[data-j="space"] .path-line{border-left:2px solid rgba(124,243,255,.35);box-shadow:0 0 12px rgba(124,243,255,.4)}
html[data-j="space"] .stop::before{border-color:#7cf3ff;box-shadow:0 0 10px #7cf3ff}
html[data-j="space"] .big img,html[data-j="space"] .mini img{border-radius:6px}
html[data-j="arcade"] .path-line{border-left:6px dotted #ffe14d}
html[data-j="arcade"] .stop::before{border-radius:0;border-color:#ff4fd8;background:#ff4fd8}
html[data-j="arcade"] .mini img,html[data-j="arcade"] .big img{border-radius:0;image-rendering:pixelated}
html[data-j="museum"] .path{padding-left:0}
html[data-j="museum"] .path-line,html[data-j="museum"] .mover,html[data-j="museum"] .stop::before{display:none}
html[data-j="museum"] .stop{text-align:center;margin-bottom:46px}
html[data-j="museum"] .big,html[data-j="museum"] .mini{display:inline-block;max-width:100%;padding:14px;background:linear-gradient(135deg,#8a6a2a,#f2d98f 30%,#b08a3a 50%,#f2d98f 70%,#8a6a2a);box-shadow:0 20px 40px rgba(0,0,0,.45)}
html[data-j="museum"] .mini{width:min(70%,320px)}
html[data-j="museum"] .mini img{width:100%;height:auto;aspect-ratio:1;border-radius:0}
html[data-j="museum"] .mini > span{display:none}
html[data-j="museum"] .big .tx{display:none}
html[data-j="museum"] .stop .tag{display:none}
html[data-j="museum"] .wl{display:inline-block;margin-top:14px;background:#fbf8f1;color:#2a2a2a;padding:10px 14px;text-align:start;max-width:300px;font-size:.92rem;box-shadow:0 6px 12px rgba(0,0,0,.3)}
html[data-j="museum"] .wl b{display:block;font-family:'Bodoni Moda',serif;font-size:1.1rem}
html[data-j="museum"] .wl i{color:#666}
.wl{display:none}
html[data-j="summit"] .path-line{border-left:4px dotted #8a6a4a}
html[data-j="summit"] .stop::before{border-color:#30476b;background:#f2b56b}

/* ACHIEVEMENTS: five reveals */
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 14px;max-width:600px;margin:0 auto}
.ach{position:relative;display:grid;place-items:center;min-height:140px;border:2px dashed var(--line);border-radius:12px;background:transparent;padding:8px;text-align:center}
.ach .q{font-family:var(--mono);color:var(--soft)}
.ach .rv2{position:absolute;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;opacity:0;transform:scale(1.5)}
.ach.on{border-color:transparent}
.ach.on .q{opacity:0}
.ach.on .rv2{opacity:1;transform:none;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .15s}
.ach b{font-weight:800;line-height:1.15;font-size:.95rem}
.ach em{font-style:normal;font-size:.76rem;opacity:.85;line-height:1.25}
.ach small{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em}
/* airline stamps */
html[data-j="airline"] .achs{padding:22px 18px;border-radius:14px;background:repeating-radial-gradient(circle,rgba(47,127,216,.06) 0 2px,transparent 2px 9px),linear-gradient(180deg,#f4f1e6,#ece6d6);box-shadow:0 18px 40px rgba(15,39,66,.18)}
html[data-j="airline"] .ach .rv2{color:var(--sc);border:3px solid var(--sc);transform:rotate(var(--r)) scale(1.6)}
html[data-j="airline"] .ach.on .rv2{transform:rotate(var(--r))}
html[data-j="airline"] .ach:nth-child(3n+1) .rv2{border-radius:50%}
html[data-j="airline"] .ach b{text-transform:uppercase}
/* space patches */
html[data-j="space"] .ach{border-radius:50%;aspect-ratio:1;min-height:0;border-color:rgba(124,243,255,.25)}
html[data-j="space"] .ach .rv2{inset:4px;border-radius:50%;background:radial-gradient(circle,#16204a 60%,var(--sc) 61% 66%,#0b1230 67% 74%,#e8f3ff 75% 77%,#0b1230 78%);color:#e8f3ff;padding:18%;transform:rotate(-200deg) scale(.3)}
html[data-j="space"] .ach.on .rv2{transform:none;transition:transform .7s cubic-bezier(.3,1.2,.4,1),opacity .2s}
html[data-j="space"] .ach b{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
html[data-j="space"] .ach em{font-size:.66rem}
/* arcade trophies */
html[data-j="arcade"] .ach{border:0;border-radius:0;background:#2a1a52;box-shadow:0 0 0 3px #5b3fa0}
html[data-j="arcade"] .ach .q{font-size:2.4rem;filter:grayscale(1) brightness(.5)}
html[data-j="arcade"] .ach .rv2{color:#ffe14d;transform:translateY(20px)}
html[data-j="arcade"] .ach.on{box-shadow:0 0 0 3px #ffe14d,0 0 20px rgba(255,225,77,.4)}
html[data-j="arcade"] .ach.on .rv2{transform:none}
html[data-j="arcade"] .ach b{font-family:'Press Start 2P',monospace;font-size:.6rem;line-height:1.6}
html[data-j="arcade"] .ach em{font-size:1.05rem;color:#f4ecff}
html[data-j="arcade"] .ach .tro{font-size:2rem}
/* museum plinths */
html[data-j="museum"] .ach{border:0;border-radius:0;min-height:180px;align-items:end;background:linear-gradient(180deg,transparent 55%,#e9dfc9 55% 58%,#d6c9ad 58% 100%)}
html[data-j="museum"] .ach::before{content:"";position:absolute;left:50%;top:-20px;width:110%;height:120%;transform:translateX(-50%);background:radial-gradient(ellipse 40% 60% at 50% 0%,rgba(255,240,200,.5),transparent 70%);opacity:0;transition:opacity .6s;pointer-events:none}
html[data-j="museum"] .ach.on::before{opacity:1}
html[data-j="museum"] .ach .q{position:absolute;bottom:12px;left:0;right:0;color:#6a5a3a;font-family:'Bodoni Moda',serif}
html[data-j="museum"] .ach .rv2{inset:auto 6px 46% 6px;color:#f4efe4;transform:translateY(10px)}
html[data-j="museum"] .ach.on .rv2{transform:none;transition:all .8s ease}
html[data-j="museum"] .ach .tro{font-size:2.2rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
html[data-j="museum"] .ach b{font-family:'Bodoni Moda',serif;font-weight:600;font-size:.98rem}
/* summit flags */
html[data-j="summit"] .ach{border:0;align-items:end;min-height:150px;background:linear-gradient(160deg,transparent 52%,#8ea4bf 52.5%) no-repeat,linear-gradient(200deg,transparent 52%,#6d84a3 52.5%);border-radius:0}
html[data-j="summit"] .ach .q{position:absolute;bottom:8px;left:0;right:0;color:#fff;font-family:var(--mono);font-weight:800}
html[data-j="summit"] .ach .rv2{inset:0 0 34% 0;transform:translateY(30px);justify-content:flex-start;padding-top:4px}
html[data-j="summit"] .ach.on .rv2{transform:none}
html[data-j="summit"] .ach .flag{position:relative;width:4px;height:44px;background:#5a3818;margin-bottom:4px}
html[data-j="summit"] .ach .flag::after{content:"";position:absolute;left:4px;top:0;width:30px;height:20px;background:var(--sc);clip-path:polygon(0 0,100% 50%,0 100%)}
html[data-j="summit"] .ach b{font-family:'Alegreya Sans',sans-serif;color:#1f2f45}
html[data-j="summit"] .ach em{color:#55667c}

/* MESSAGES */
.mgroup{margin-bottom:26px}
.mgroup h3{font-family:var(--mono);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:12px;text-align:center}
.mlist{display:grid;grid-template-columns:1fr;gap:14px;max-width:560px;margin:0 auto}
@media (min-width:640px){.mlist{grid-template-columns:repeat(2,1fr);max-width:820px}}
/* airline postcards */
.pc{position:relative;width:100%;aspect-ratio:3/2;border:0;padding:0;background:none;text-align:start}
.pc-face{position:absolute;inset:0;border-radius:6px;overflow:hidden;box-shadow:0 12px 26px rgba(15,39,66,.18)}
.pc .front{background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc));display:flex;align-items:flex-end;padding:14px;color:#fff}
.pc .front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .front .gr{position:relative;font-weight:900;font-size:clamp(1.4rem,6.4vw,1.9rem);line-height:1}
.pc .front .gr small{display:block;font-family:var(--hand);font-weight:400;font-size:1.1rem}
.pc .front.drawn .gr{color:#0f2742;background:rgba(255,250,241,.88);padding:6px 10px;border-radius:6px}
.pc .back{display:none;background:#fffaf1;padding:14px 16px;grid-template-columns:1fr 70px;gap:8px}
.pc.on .front{display:none}.pc.on .back{display:grid}
.pc .msgt{font-family:var(--hand);font-size:clamp(1rem,4.2vw,1.18rem);line-height:1.3;color:#2a3a52;overflow:auto;border-right:1.5px solid rgba(15,39,66,.14);padding-right:8px}
.pc .msgt b{display:block;margin-top:6px;font-size:1.3rem;color:var(--pc);font-weight:400}
.pc .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pc .stp{width:54px;height:64px;display:grid;place-items:center;font-size:1.6rem;background:color-mix(in srgb,var(--pc) 20%,#fff);outline:2px dashed var(--pc);outline-offset:-5px}
/* space transmissions */
.tx-card{width:100%;border:1px solid rgba(124,243,255,.3);border-radius:8px;background:rgba(124,243,255,.05);padding:14px 16px;text-align:start;color:#e8f3ff}
.tx-card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'Share Tech Mono',monospace;color:#7cf3ff}
.tx-card .wave{height:26px;margin:10px 0;background:repeating-linear-gradient(90deg,rgba(124,243,255,.7) 0 2px,transparent 2px 5px);-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);transform-origin:50% 50%;animation:wave 1.2s ease-in-out infinite}
@keyframes wave{50%{transform:scaleY(.35)}}
.tx-card .body{font-family:'Share Tech Mono',monospace;font-size:1rem;line-height:1.5;min-height:1.5em;white-space:pre-wrap}
.tx-card.on .wave{animation:none;transform:scaleY(.1);opacity:.4}
/* arcade party, museum audio guide, summit cairn → open a sheet */
.who{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:start}
.who .av{flex:none;width:52px;height:52px;display:grid;place-items:center;font-size:1.7rem}
.who b{display:block;font-family:var(--display);font-weight:var(--dw)}
.who small{color:var(--soft);font-family:var(--mono)}
html[data-j="arcade"] .who .av{background:var(--pc);box-shadow:0 0 0 3px #1b1036,0 0 0 6px var(--pc);image-rendering:pixelated}
html[data-j="arcade"] .who b{font-size:.75rem;line-height:1.6}
html[data-j="museum"] .who{background:#fbf8f1;color:#2a2a2a;border-radius:4px}
html[data-j="museum"] .who .av{border-radius:50%;background:#23382f;color:#f4efe4;font-family:'Bodoni Moda',serif;font-size:1.4rem;font-weight:700}
html[data-j="museum"] .who small{color:#666}
html[data-j="summit"] .stones{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:560px;margin:0 auto}
html[data-j="summit"] .who{width:auto;flex-direction:column;gap:4px;padding:18px 20px;border-radius:46% 54% 50% 50%/60% 55% 45% 40%;background:linear-gradient(145deg,#b9c2cc,#8b96a3);color:#1f2f45;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 8px 14px rgba(31,47,69,.2);text-align:center;border:0}
html[data-j="summit"] .who .av{width:auto;height:auto;font-size:1.5rem}
html[data-j="summit"] .who small{color:#33445a}

/* GOALS */
.goals{max-width:560px;margin:0 auto;padding:0;list-style:none;overflow:hidden}
.goals li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-top:1.5px dashed var(--line)}
.goals li:first-child{border-top:0}
.goals .c{font-family:var(--display);font-weight:var(--dw)}
.goals .s{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .5rem;border-radius:4px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
html[data-j="arcade"] .goals .c{color:#ffe14d;font-size:.7rem}
html[data-j="arcade"] .goals .s{border-radius:0;font-size:1rem}
html[data-j="museum"] .goals{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:none;box-shadow:none}
html[data-j="museum"] .goals li{grid-template-columns:1fr;border:0;background:#fbf8f1;color:#2a2a2a;text-align:center;padding:20px 12px;font-family:'Bodoni Moda',serif;font-size:1.05rem}
html[data-j="museum"] .goals .c{display:none}

    arcade: `<div class="tally" id="tally" hidden><small>${UI.score}</small><span id="score">0</span></div><button class="fin-act" data-act="finale">${esc(W('finale'))}</button>`,
    museum: `<div class="curtain l" id="cl"></div><div class="curtain r" id="cr"></div><button class="fin-act" data-act="finale">${esc(W('finale'))}</button>`,
    summit: `<div class="sun" id="sun"></div><div class="mts" aria-hidden="true"><svg viewBox="0 0 400 160" preserveAspectRatio="none"><path d="M0 160 L80 70 L140 110 L200 20 L260 100 L330 60 L400 120 V160Z" fill="#4b5f84"/><path d="M200 20 V-14" stroke="#5a3818" stroke-width="3"/><path id="topflag" d="M201 -14 L226 -6 L201 2Z" fill="#e2553b" opacity="0"/><path d="M0 160 L100 120 L190 140 L280 100 L400 150 V160Z" fill="#30476b"/></svg></div>
      <button class="fin-act" data-act="finale">⛰ ${esc(W('finale'))}</button>`
  }[j];
  return `<section class="finale f-${j}" id="finale">${scene}${msg}</section>`;
}
function renderPage() { page.innerHTML = heroHTML() + G.sections.filter(s => CH[s]).map(s => CH[s]()).join('') + finaleHTML(); }
function renderChrome() {
  const sw = { airline: 'background:linear-gradient(180deg,#0f2742,#e9845f)', space: 'background:radial-gradient(circle,#16204a,#070b1f)', arcade: 'background:#1b1036;box-shadow:inset 0 0 0 3px #ff4fd8', museum: 'background:linear-gradient(135deg,#8a6a2a,#f2d98f,#8a6a2a)', summit: 'background:linear-gradient(180deg,#30476b,#f2b56b)' };
  chrome.innerHTML = `<div class="ctl"><button class="ib" data-act="sound" aria-pressed="${state.sound}" aria-label="${state.sound ? UI.soundOn : UI.soundOff}">${icon(state.sound ? 'on' : 'off')}</button>${G.share.enabled ? `<button class="ib" data-act="share" aria-label="${UI.share}">${icon('share')}</button>` : ''}<button class="ib" data-act="journeys" aria-label="${UI.journeys}">${icon('map')}</button></div>
  <div class="sheet-bg" id="j-bg" data-act="bg-close"><div class="sheet" role="dialog" aria-label="${UI.journeysTitle}"><button class="sheet-x" data-act="close" aria-label="${UI.close}">${icon('close')}</button><h3>${UI.journeysTitle}</h3>
    <ul class="th-list">${Object.entries(JOURNEYS).map(([id, s]) => `<li><button class="th" data-act="journey" data-id="${id}" aria-pressed="${id === state.j}"><span class="th-sw" style="${sw[id]}">${s.swatch}</span><span class="th-t"><b>${esc(s.name)}</b><small>${esc(s.tag)}</small></span></button></li>`).join('')}</ul><p class="note-s">${UI.journeysNote}</p></div></div>
  <div class="sheet-bg" id="msg-bg" data-act="bg-close"><div class="sheet" role="dialog" aria-modal="true" id="msg-sheet"></div></div>
  <div class="sheet-bg" id="reply-bg" data-act="bg-close"><div class="sheet" role="dialog" aria-label="${esc(W('reply'))}"><button class="sheet-x" data-act="close" aria-label="${UI.close}">${icon('close')}</button>
    <div id="reply-body"><h3>${esc(W('reply'))}</h3><div class="reacts">${G.reply.reactions.map((r, i) => `<button class="react" data-act="react" data-i="${i}" aria-pressed="false"><span>${esc(r.emoji)}</span>${esc(r.text)}</button>`).join('')}</div>
    <textarea id="reply-text" placeholder="${UI.replyPlaceholder}" aria-label="${esc(W('reply'))}"></textarea><button class="btn btn-primary" data-act="send">${icon('send')} ${UI.send}</button><p class="note-s">${UI.proto}</p></div></div></div>
  <div class="lb" id="lb" role="dialog" aria-modal="true" hidden><button class="ib lb-x" data-act="lb-close" aria-label="${UI.close}">${icon('close')}</button><button class="lb-nav prev" data-act="lb-prev" aria-label="${UI.prev}">${icon('left')}</button><figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure><button class="lb-nav next" data-act="lb-next" aria-label="${UI.next}">${icon('right')}</button></div>`;
}

/* ════════════ BEHAVIOUR ════════════ */
function setScreen(s) { document.body.dataset.screen = s; document.body.classList.toggle('hold', s === 'start'); }
async function begin() {
  if (state.started) return; state.started = true; API.track('started:' + state.j);
  await START[state.j].go();
  page.hidden = false; setScreen('page'); scrollTo(0, 0); onScroll();
  if (state.j === 'airline') { SFX.play('win'); anim($('#shade'), [{ transform: 'none' }, { transform: 'translateY(-100%)' }], { duration: reduce ? 1 : 1400, delay: reduce ? 0 : 500, easing: 'cubic-bezier(.4,0,.2,1)' }); }
  await done(anim($('#start-s'), [{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 1 : 700 })); startEl.innerHTML = '';
}
function onScroll() {
  const box = $('#pathbox'), mv = $('#mover');
  if (box && mv) { const r = box.getBoundingClientRect(), p = clamp((innerHeight * .55 - r.top) / Math.max(1, r.height), 0, 1); mv.style.transform = `translateY(${(p * Math.max(0, r.height - 34)).toFixed(1)}px)`; }
  const alt = $('#alt'); if (alt) { const h = document.documentElement.scrollHeight - innerHeight, p = clamp(scrollY / Math.max(1, h), 0, 1); alt.textContent = `${UI.altitude}: ${Math.round(p * 4808).toLocaleString(G.meta.locale)} m`; }
}
addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
function showUnlock(a, i) { const u = $('#unlock'); u.innerHTML = `<span style="font-size:1.8rem">${TROPHIES[i % 10]}</span><span><b>ACHIEVEMENT UNLOCKED</b>${esc(a.title)}</span>`; u.classList.add('show'); clearTimeout(u._t); u._t = setTimeout(() => u.classList.remove('show'), 2200); }
function reveal(btn) {
  if (btn.classList.contains('on')) return; btn.classList.add('on'); SFX.play('ach'); const i = +btn.dataset.i;
  if (state.j === 'arcade') showUnlock(ACH[i], i);
  anim(btn, [{ transform: 'scale(1)' }, { transform: 'scale(.94)' }, { transform: 'scale(1)' }], { duration: 260, fill: 'none' });
  const n = $$('.ach.on').length; $('#achcount').textContent = fill(W('achCount'), { n, t: ACH.length }); if (n === ACH.length) setTimeout(() => burstAt($('#achcount'), 36), 300);
}
async function turn(card) {
  if (card.dataset.busy) return; card.dataset.busy = 1; SFX.play('msg');
  const a = anim(card, [{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: reduce ? 1 : 170, easing: 'ease-in', fill: 'forwards' }); await done(a);
  card.classList.toggle('on');
  const b = anim(card, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: reduce ? 1 : 210, easing: 'ease-out', fill: 'forwards' }); await done(b);
  if (a) a.cancel(); if (b) b.cancel(); delete card.dataset.busy; if (!card.classList.contains('on')) stopVoice();
}
async function typeInto(el, text, tick) { el.textContent = ''; if (reduce) { el.textContent = text; return; } for (let k = 0; k < text.length; k++) { el.textContent += text[k]; if (k % 3 === 0 && tick) SFX.play('tick'); await wait(text[k] === ' ' ? 18 : 26); if (!el.isConnected) return; } }
async function decode(card) {
  if (card.classList.contains('on') || card.dataset.busy) return; card.dataset.busy = 1; const p = G.messages[+card.dataset.g].people[+card.dataset.i], body = $('.body', card);
  SFX.play('msg'); body.textContent = UI.decoding; await wait(reduce ? 0 : 800); card.classList.add('on');
  await typeInto(body, p.message + '\n— ' + p.name, true); delete card.dataset.busy;
  if (p.voice) { card.insertAdjacentHTML('beforeend', `<span class="voice" style="--pc:#ff8a3d"><span class="vb" role="button" tabindex="0" data-voice="${card.dataset.g}-${card.dataset.i}" aria-label="${UI.voicePlay}">${icon('play')}</span><span class="vcap" id="vcap-${card.dataset.g}-${card.dataset.i}">${p.voice.src ? '' : UI.voiceDemo}</span></span>`); }
}
function openMsg(gi, i) {
  const p = G.messages[gi].people[i], sh = $('#msg-sheet'), j = state.j; stopVoice(); SFX.play('msg');
  sh.style.setProperty('--pc', p.color);
  sh.innerHTML = `<button class="sheet-x" data-act="close" aria-label="${UI.close}">${icon('close')}</button><div class="m-head"><span class="av" aria-hidden="true">${j === 'museum' ? '🎧' : esc(p.emoji || '🙂')}</span><b>${esc(j === 'arcade' ? p.name.toUpperCase() : p.name)}</b></div>
    <p class="m-text" id="m-text"></p>${p.drawing ? `<div class="m-draw"><img src="${artSrc(p.drawing, 70 + i)}" alt=""></div>` : ''}
    ${p.voice ? `<div class="voice"><span class="vb" role="button" tabindex="0" data-voice="${gi}-${i}" aria-label="${UI.voicePlay}">${icon('play')}</span><span class="vcap" id="vcap-${gi}-${i}">${p.voice.src ? '' : UI.voiceDemo}</span></div>` : ''}`;
  $('#msg-bg').classList.add('open');
  const t = $('#m-text'); if (j === 'arcade') typeInto(t, p.message, true); else t.textContent = p.message;
  if (j === 'museum' && p.voice) setTimeout(() => { const b = $('[data-voice]', sh); if (b) voiceToggle(b.dataset.voice, b); }, 400);
}
let curVoice = null;
function voiceToggle(id, btn) {
  if (curVoice && curVoice.id === id) { stopVoice(); return; } stopVoice();
  const [gi, i] = id.split('-').map(Number), v = G.messages[gi].people[i].voice, t0 = performance.now(); let raf = 0, audio = null;
  const cap = () => document.getElementById('vcap-' + id);
  curVoice = { id, stop() { cancelAnimationFrame(raf); if (audio) audio.pause(); btn.innerHTML = icon('play'); btn.setAttribute('aria-label', UI.voicePlay); const c = cap(); if (c) c.textContent = v.src ? '' : UI.voiceDemo; } };
  if (v.src) { audio = new Audio(v.src); audio.play().catch(() => {}); audio.addEventListener('ended', stopVoice); }
  btn.innerHTML = icon('pause'); btn.setAttribute('aria-label', UI.voicePause);
  const loop = () => { const c = audio ? audio.currentTime : (performance.now() - t0) / 1000, l = (v.transcript || []).filter(x => x.t <= c).pop(), el = cap(); if (el) el.textContent = l ? '“' + l.text + '”' : ''; if (c >= (+v.durationSec || 10)) { stopVoice(); return; } raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
}
function stopVoice() { if (curVoice) { curVoice.stop(); curVoice = null; } }

/* finales */
const FINALE = {
  async airline() { SFX.play('finale'); await done(anim($('#jet'), [{ transform: 'translate(40px,150px)' }, { transform: 'translate(260px,150px)', offset: .45 }, { transform: 'translate(420px,90px) rotate(-12deg)', offset: .75 }, { transform: 'translate(640px,-80px) rotate(-18deg)' }], { duration: reduce ? 1 : 2600, easing: 'cubic-bezier(.5,0,.6,1)' })); },
  async space() { SFX.play('finale'); $('#flame').setAttribute('opacity', 1); await done(anim($('#rocket'), [{ transform: 'translateY(0)' }, { transform: 'translateY(6px)', offset: .1 }, { transform: 'translateY(0)', offset: .2 }, { transform: 'translateY(-130vh)' }], { duration: reduce ? 1 : 2400, easing: 'cubic-bezier(.6,0,.9,.6)' })); },
  async arcade() { const t = $('#tally'), s = $('#score'), total = 2027 * 100 + ACH.length * 1000; t.hidden = false; const t0 = performance.now(), D = reduce ? 1 : 1800;
    await new Promise(res => { const step = () => { const p = Math.min(1, (performance.now() - t0) / D); s.textContent = Math.round(total * p).toLocaleString('en'); if (Math.random() < .5) SFX.play('coin'); p < 1 ? requestAnimationFrame(step) : res(); }; step(); }); },
  async museum() { SFX.play('finale'); anim($('#cl'), [{ transform: 'none' }, { transform: 'translateX(-100%)' }], { duration: reduce ? 1 : 1600, easing: 'cubic-bezier(.6,0,.3,1)' }); await done(anim($('#cr'), [{ transform: 'none' }, { transform: 'translateX(100%)' }], { duration: reduce ? 1 : 1600, easing: 'cubic-bezier(.6,0,.3,1)' })); },
  async summit() { SFX.play('finale'); await done(anim($('#sun'), [{ transform: 'translateY(160px)' }, { transform: 'translateY(-60px)' }], { duration: reduce ? 1 : 2400, easing: 'cubic-bezier(.3,0,.2,1)' })); $('#topflag').setAttribute('opacity', 1); }
};
async function finale(btn) {
  const sec = $('#finale'); if (sec.classList.contains('done') || sec.dataset.busy) return; sec.dataset.busy = 1; if (btn) btn.disabled = true; API.track('finale:' + state.j);
  await FINALE[state.j](); sec.classList.add('done'); SFX.play('win'); cheer();
}
/* space: press-and-hold launch */
let hold = null;
function holdStart(e) {
  const b = e.target.closest('[data-hold]'); if (!b || $('#finale').classList.contains('done')) return; e.preventDefault();
  const fillEl = $('#holdfill'), t0 = performance.now(), D = reduce ? 200 : 1600;
  hold = { raf: 0 }; const step = () => { const p = Math.min(1, (performance.now() - t0) / D); fillEl.style.width = (p * 100) + '%'; if (p % .1 < .02) SFX.play('tick'); if (p >= 1) { hold = null; b.hidden = true; finale(); return; } hold.raf = requestAnimationFrame(step); }; step();
}
function holdEnd() { if (!hold) return; cancelAnimationFrame(hold.raf); hold = null; const f = $('#holdfill'); if (f) anim(f, [{ width: f.style.width }, { width: '0%' }], { duration: 250, fill: 'forwards' }).finished.then(() => { f.style.width = '0%'; }).catch(() => {}); }
document.addEventListener('pointerdown', holdStart); ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, holdEnd));

function lbShow(i) { const s = G.path.stops, n = s.length; state.lb = (i + n) % n; $('#lb-img').src = artSrc(s[state.lb].photo, 10 + state.lb); $('#lb-cap').textContent = `${s[state.lb].year} · ${s[state.lb].caption}`; }
async function share() {
  const data = { title: `${g.fullName} · Class of ${g.year}`, text: G.ending.sub, url: pageURL() };
  if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(data.url); toast(UI.copied); } catch (e) { toast(UI.copyFailed); }
}
async function sendReply() {
  const txt = $('#reply-text').value.trim(), r = state.reaction; if (!txt && r == null) { toast(UI.replyEmpty); return; }
  const btn = $('[data-act="send"]'); btn.disabled = true; btn.textContent = UI.sending;
  await API.sendReply({ journey: state.j, reaction: r != null ? G.reply.reactions[r] : null, message: txt });
  $('#reply-body').innerHTML = `<div class="sent"><p class="em">${r != null ? esc(G.reply.reactions[r].emoji) : '🎓'}</p><h3>${UI.sentTitle}</h3><p>${UI.sentSub}</p><p class="note-s">${UI.proto}</p></div>`; cheer();
}
function syncSound() { $$('[data-act="sound"]').forEach(b => { b.setAttribute('aria-pressed', state.sound); b.innerHTML = b.classList.contains('chip') ? `${icon(state.sound ? 'on' : 'off')} ${state.sound ? UI.soundOn : UI.soundOff}` : icon(state.sound ? 'on' : 'off'); }); }
function closeSheets() { $$('.sheet-bg.open').forEach(s => s.classList.remove('open')); stopVoice(); }
function setJourney(id) {
  state.j = JOURNEYS[id] ? id : 'airline'; document.documentElement.dataset.j = state.j;
  const m = $('meta[name="theme-color"]'); if (m) m.content = J().theme;
}
function start() {
  closeSheets(); state.started = false; state.reaction = null;
  renderPage(); renderChrome(); startEl.innerHTML = START[state.j].html(); page.hidden = true; setScreen('start'); scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-voice]'); if (v) { e.stopPropagation(); voiceToggle(v.dataset.voice, v); return; }
  const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
  if (act === 'bg-close') { if (e.target === a) closeSheets(); return; }
  switch (act) {
    case 'start': begin(); break;
    case 'sound': state.sound = !state.sound; syncSound(); break;
    case 'journeys': $('#j-bg').classList.add('open'); break;
    case 'journey': setJourney(a.dataset.id); start(); break;
    case 'close': closeSheets(); break;
    case 'ach': reveal(a); break;
    case 'card': turn(a); break;
    case 'decode': decode(a); break;
    case 'msg': openMsg(+a.dataset.g, +a.dataset.i); break;
    case 'lb': lbShow(+a.dataset.i); $('#lb').hidden = false; break;
    case 'lb-close': $('#lb').hidden = true; break;
    case 'lb-prev': lbShow(state.lb - 1); break;
    case 'lb-next': lbShow(state.lb + 1); break;
    case 'finale': finale(a); break;
    case 'reply': $('#reply-bg').classList.add('open'); break;
    case 'react': { const i = +a.dataset.i; state.reaction = state.reaction === i ? null : i; $$('.react').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === state.reaction)); break; }
    case 'send': sendReply(); break;
    case 'share': share(); break;
    case 'again': start(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#lb').hidden) $('#lb').hidden = true; else closeSheets(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches) {
    if (e.target.matches('#startbtn[role="button"]')) { e.preventDefault(); begin(); }
    else if (e.target.matches('[data-voice]')) { e.preventDefault(); voiceToggle(e.target.dataset.voice, e.target); }
    else if (e.target.matches('[data-hold]')) { e.preventDefault(); if (!$('#finale').classList.contains('done')) { e.target.hidden = true; finale(); } }
  }
});

/* ════════════ BOOT ════════════ */
document.documentElement.lang = G.meta.lang; document.documentElement.dir = G.meta.dir;
let jj = G.journey; try { const q = new URLSearchParams(location.search); if (q.get('journey')) jj = q.get('journey'); } catch (e) {}
setJourney(jj); start();
})();
</script>
</body>
